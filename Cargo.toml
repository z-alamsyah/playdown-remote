[package]
name = "playdown-remote"
version = "0.2.0"
description = "Remote access companion for Playdown — control your terminal sessions and agents from a phone browser"
authors = ["z-alamsyah"]
license = "MIT"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "sync", "rt-multi-thread", "macros", "time"] }
axum = { version = "0.8", features = ["ws"] }
serde_json = "1"
base64 = "0.22"
rand = "0.8"
qrcode = "0.14"
local-ip-address = "0.6"
# Telegram bot (long polling). rustls so Linux builds don't need OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Virtual terminal for readable /tail snippets — TUIs repaint with cursor
# positioning, so only a rendered screen (not the byte stream) reads as text.
vt100 = "0.15"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
