<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Playdown Remote</title>
<link rel="stylesheet" href="/assets/xterm.css" />
<style>
  /* Spacing uses margins, not flex `gap`: Safari 12 (iOS 12) has no flex gap. */
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #0d1117; color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    /* Pinned so iOS can't pan the layout when the keyboard opens; the height
       is synced to visualViewport so nothing hides behind the keyboard. */
    position: fixed; top: 0; right: 0; bottom: 0; left: 0; width: 100%;
    overscroll-behavior: none;
  }
  header {
    display: flex; align-items: center;
    padding: 10px 12px; border-bottom: 1px solid #30363d; flex-shrink: 0;
  }
  header > * { margin-right: 10px; }
  header > :last-child { margin-right: 0; }
  .brand { font-weight: 800; font-size: 15px; letter-spacing: .02em; }
  .conn { width: 8px; height: 8px; border-radius: 50%; background: #f85149; flex-shrink: 0; }
  .conn.up { background: #3fb950; }
  .count { margin-left: auto; color: #8d96a0; font-size: 13px; font-weight: 600; }
  .back {
    display: none; background: none; border: none; color: #58a6ff;
    font-size: 24px; line-height: 1; padding: 0 8px 3px 0; cursor: pointer;
  }
  #hdrSession { display: none; align-items: center; min-width: 0; }
  #hdrSession .nm {
    font-weight: 700; font-size: 15px; margin-left: 8px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ---- session list (page 1) ---- */
  #viewList { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 12px; }
  .sect { margin-bottom: 20px; }
  .sect h2 {
    display: flex; align-items: center;
    font-size: 11px; font-weight: 700; letter-spacing: .09em;
    color: #8d96a0; margin: 0 2px 8px;
  }
  .sect h2 > span { margin-right: 7px; }
  .actions { display: flex; margin-bottom: 18px; }
  .actions button {
    flex: 1; padding: 11px; border-radius: 10px;
    border: 1px dashed #30363d; background: #161b22; color: #8d96a0;
    font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer;
  }
  .actions button + button { margin-left: 8px; }
  .actions button:active { background: #21262d; color: #e6edf3; }
  .row {
    display: flex; align-items: center; width: 100%;
    background: #161b22; border: 1px solid #30363d; border-radius: 10px;
    padding: 6px 6px 6px 12px; margin-bottom: 8px; color: #e6edf3;
    font-size: 15px; text-align: left; cursor: pointer;
    font-family: inherit;
  }
  .row > * + * { margin-left: 11px; }
  .row:active { background: #21262d; }
  .row.blocked { border-color: rgba(248, 81, 73, .55); background: rgba(248, 81, 73, .08); }
  .row .meta { min-width: 0; padding: 7px 0; }
  .row .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sub { color: #8d96a0; font-size: 12.5px; margin-top: 2px; }
  .row .x {
    margin-left: auto; flex-shrink: 0;
    width: 42px; padding: 12px 0; text-align: center;
    background: none; border: none; border-radius: 8px;
    color: #6e7681; font-size: 17px; line-height: 1; cursor: pointer;
  }
  .row .x:active { background: #30363d; color: #f85149; }
  .empty { color: #6e7681; font-size: 14px; padding: 40px 20px; text-align: center; }
  .ver { color: #484f58; font-size: 11px; text-align: center; padding: 14px 0 4px; }

  .dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid #6e7681; background: transparent; flex-shrink: 0; }
  .dot.blocked { background: #f85149; border-color: #f85149; }
  .dot.done { background: #3fb950; border-color: #3fb950; }
  .spin {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid rgba(88, 166, 255, .3); border-top-color: #58a6ff;
    animation: r .9s linear infinite;
  }
  @keyframes r { to { transform: rotate(360deg); } }

  /* ---- terminal (page 2) ---- */
  #viewTerm { flex: 1; min-height: 0; display: none; flex-direction: column; }
  main { flex: 1; min-height: 0; padding: 6px 4px 8px 8px; position: relative; }
  #term { height: 100%; }
  /* Terminal key bar — iOS keyboards have no Esc/arrows, TUIs need them */
  .keybar {
    display: flex; padding: 6px 8px; flex-shrink: 0;
    border-top: 1px solid #30363d; overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  .keybar button {
    min-width: 44px; padding: 8px 10px; border-radius: 7px; border: 1px solid #30363d;
    background: #21262d; color: #e6edf3; font-size: 13px;
    font-family: ui-monospace, Menlo, monospace; flex-shrink: 0;
    touch-action: manipulation;
  }
  .keybar button + button { margin-left: 6px; }
  .keybar button:active { background: #30363d; }
  .keybar button.armed { background: #1c4f9c; border-color: #58a6ff; }

  /* ---- quick actions: floating button, its radial menu, bottom sheets ---- */
  .hide { display: none !important; }
  #err {
    padding: 8px 12px; flex-shrink: 0; cursor: pointer;
    background: #3d1d1d; border-bottom: 1px solid #f85149; color: #ffb4ac; font-size: 12.5px;
  }
  /* Playdown orange (the logo's #f83800 to #f87810), with a lit gradient rim. */
  #fab {
    position: absolute; z-index: 7; width: var(--fab); height: var(--fab); padding: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; border: 3px solid transparent; color: #fff;
    background:
      radial-gradient(circle at 34% 28%, #ff9a3c, #f85a00 58%, #e03c00) padding-box,
      linear-gradient(145deg, #ffe0a8, #ff7a1a 45%, #a82600) border-box;
    box-shadow: 0 6px 18px rgba(248, 72, 0, .45), 0 2px 6px rgba(0, 0, 0, .45);
    touch-action: none; -webkit-tap-highlight-color: transparent;
  }
  #fab.open { box-shadow: 0 0 0 7px rgba(248, 90, 0, .2), 0 6px 18px rgba(248, 72, 0, .5); }
  #fab svg { width: 44%; height: 44%; transition: transform .15s; }
  #fab.open svg { transform: rotate(45deg); }
  .at-r { right: 14px; }
  .at-l { left: 14px; }
  #fab.at-b { bottom: 14px; }
  #fab.at-m { top: 50%; margin-top: calc(var(--fab) / -2); }
  #radial {
    position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 6;
    background: rgba(1, 4, 9, .55); touch-action: none;
  }
  #radialHint {
    position: absolute; left: 50%; top: 14px; max-width: calc(100% - 28px);
    -webkit-transform: translateX(-50%); transform: translateX(-50%);
    padding: 7px 14px; border-radius: 999px; background: #161b22; border: 1px solid #30363d;
    color: #e6edf3; font-size: 13px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    box-shadow: 0 4px 12px rgba(0, 0, 0, .5);
  }
  .ri {
    position: absolute; width: 48px; height: 48px; margin: -24px 0 0 -24px;
    display: flex; align-items: center; justify-content: center; border-radius: 50%;
    background: #21262d; border: 1px solid #3d444d; color: #e6edf3;
    box-shadow: 0 4px 12px rgba(0, 0, 0, .5);
    transition: transform .18s ease-out, opacity .18s, border-color .1s, background .1s;
  }
  .ri svg { width: 22px; height: 22px; }
  .ri.tp { width: 56px; height: 56px; margin: -28px 0 0 -28px; font: 600 10.5px ui-monospace, Menlo, monospace; }
  .ri .run {
    position: absolute; top: -3px; right: -3px; width: 18px; height: 18px; border-radius: 50%;
    background: #f85a00; color: #fff; font-size: 11px; line-height: 18px; text-align: center;
  }
  .ri.on { transform: scale(1.18); background: #3a2112; border-color: #ff8a2b; }
  @media (prefers-reduced-motion: reduce) { .ri, #fab svg { transition: none; } }

  #sheetShade {
    position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 9;
    background: rgba(1, 4, 9, .55); cursor: pointer; /* iOS only sends clicks to "clickable" things */
  }
  #sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
    max-height: 85%; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: #161b22; border-top: 1px solid #30363d; border-radius: 16px 16px 0 0;
    padding: 14px 14px calc(14px + env(safe-area-inset-bottom));
  }
  .sh-head { display: flex; align-items: center; margin-bottom: 12px; }
  .sh-head b { font-size: 15px; }
  .sh-head button {
    margin-left: auto; padding: 4px; background: none; border: none;
    color: #58a6ff; font-size: 15px; font-weight: 600; font-family: inherit;
  }
  .h { color: #8d96a0; font-size: 11px; font-weight: 700; letter-spacing: .08em; margin: 16px 2px 8px; }
  .seg { display: flex; flex-wrap: wrap; margin-right: -6px; }
  .seg button {
    flex: 1 1 28%; margin: 0 6px 6px 0; padding: 10px 6px; border-radius: 9px;
    border: 1px solid #30363d; background: #21262d; color: #e6edf3;
    font-size: 13px; font-family: inherit;
  }
  .seg.two button { flex-basis: 40%; }
  .seg button.on { background: #1c4f9c; border-color: #58a6ff; }
  .field {
    width: 100%; padding: 10px 11px; border-radius: 9px; border: 1px solid #30363d;
    background: #0d1117; color: #e6edf3; font: 16px ui-monospace, Menlo, monospace;
  }
  textarea.field { resize: none; font-family: inherit; }
  .trow { display: flex; align-items: center; margin-bottom: 8px; }
  .trow .field { flex: 1; min-width: 0; }
  .trow label { display: flex; align-items: center; margin-left: 10px; color: #8d96a0; font-size: 13px; white-space: nowrap; }
  .trow input[type=checkbox] { width: 18px; height: 18px; margin-right: 5px; }
  .btns { display: flex; margin-top: 10px; }
  .btns button, .wide {
    flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #30363d;
    background: #21262d; color: #e6edf3; font-size: 15px; font-weight: 600; font-family: inherit;
  }
  .btns button + button { margin-left: 8px; }
  .btns .primary { background: #238636; border-color: #2ea043; }
  .wide { display: block; width: 100%; margin-top: 4px; font-size: 14px; color: #8d96a0; }
  .note { color: #8d96a0; font-size: 12.5px; margin-top: 8px; line-height: 1.4; }
  .lk {
    display: block; padding: 11px 12px; margin-bottom: 8px; border-radius: 9px;
    border: 1px solid #30363d; background: #21262d; color: #58a6ff; text-decoration: none;
    font: 12.5px ui-monospace, Menlo, monospace; word-break: break-all;
  }
  .lk small { display: block; margin-top: 5px; color: #8d96a0; font: 12px -apple-system, sans-serif; word-break: normal; }
  /* Safari 12 has no visualViewport, so the page can't measure the keyboard.
     iOS does scroll the focused input into view, though, and xterm's hidden
     input follows the cursor (often near the top). Pinned to the bottom, that
     scroll lifts the prompt and the key bar above the keyboard. */
  .novv .xterm .xterm-helper-textarea {
    position: fixed !important; top: auto !important; bottom: 0 !important; left: 0 !important;
  }
  .plain {
    white-space: pre-wrap; word-break: break-all; color: #e6edf3;
    font: 12px ui-monospace, Menlo, monospace; -webkit-user-select: text; user-select: text;
  }
</style>
</head>
<body>
  <header>
    <button class="back" id="back">‹</button>
    <span class="conn" id="conn"></span>
    <span class="brand" id="brand">Playdown</span>
    <span id="hdrSession"><span id="hdrDot" class="dot"></span><span class="nm" id="hdrName"></span></span>
    <span class="count" id="count"></span>
  </header>

  <div id="err" class="hide"></div>

  <div id="viewList"><div class="empty">Connecting…</div></div>

  <div id="viewTerm">
    <main>
      <div id="term"></div>
      <div id="radial" class="hide"><div id="radialHint"></div></div>
      <button id="fab" class="hide" aria-label="Quick actions"></button>
    </main>
    <div class="keybar" id="keybar">
      <button data-seq="&#27;">esc</button>
      <button data-seq="&#9;">tab</button>
      <button id="ctrlKey">ctrl</button>
      <button data-seq="&#27;[A">↑</button>
      <button data-seq="&#27;[B">↓</button>
      <button data-seq="&#27;[D">←</button>
      <button data-seq="&#27;[C">→</button>
      <button data-seq="&#13;">↵</button>
      <button data-seq="&#3;">^C</button>
      <button id="fontMinus">A−</button>
      <button id="fontPlus">A+</button>
    </div>
  </div>

  <div id="sheetShade" class="hide"></div>
  <div id="sheet" class="hide">
    <div class="sh-head"><b id="sheetTitle"></b><button id="sheetClose">Done</button></div>
    <div id="sheetBody"></div>
  </div>

<script>
  // Safari 12 (iOS 12) lacks these and xterm.js calls them. replaceChildren
  // is the DOM renderer's (old Safari has no WebGL2, so it always gets that one).
  if (typeof globalThis === "undefined") window.globalThis = window;
  if (!window.queueMicrotask) window.queueMicrotask = function (f) { Promise.resolve().then(f); };
  if (!Element.prototype.replaceChildren) {
    Element.prototype.replaceChildren = function () {
      while (this.lastChild) this.removeChild(this.lastChild);
      this.append.apply(this, arguments);
    };
  }
  // Old browsers fail in ways that can't be tested here: say what broke
  // instead of leaving a blank screen.
  window.addEventListener("error", function (e) {
    if (/ResizeObserver loop/.test(e.message)) return; // harmless, Chrome only
    var b = document.getElementById("err");
    b.textContent = "Error: " + e.message + " (tap to hide)";
    b.className = "";
  });
</script>
<script src="/assets/xterm.js"></script>
<script src="/assets/addon-fit.js"></script>
<script src="/assets/addon-webgl.js"></script>
<script>
  // Plain ES2017 on purpose (no ?. or ??, no pointer-only events): one
  // unsupported token and Safari 12 drops the whole script, leaving the page
  // stuck on "Connecting…". The xterm files are lowered the same way.
  const VIEW_ONLY = __VIEW_ONLY__;
  const VERSION = "__VERSION__";
  const token = (location.hash.match(/t=([0-9a-f]+)/) || [])[1] || "";
  let ws, sessions = [], current = null, term, fit, view = "list";
  let expired = false; // this link's token is from an earlier run
  let tsHost = ""; // the computer's Tailscale address, sent after the token check

  const $ = (id) => document.getElementById(id);
  const online = () => ws && ws.readyState === 1;

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function strToB64(s) {
    const bytes = new TextEncoder().encode(s);
    let bin = "";
    for (const b of bytes) bin += String.fromCharCode(b);
    return btoa(bin);
  }

  // A tap that keeps focus on the terminal (a click would close the iOS
  // keyboard). It acts on release and only if the finger didn't travel, so
  // dragging to scroll the key bar or the menu doesn't fire what it started on.
  // Safari 12 has no pointer events: touch there, mouse on desktop.
  function press(el, fn) {
    let x = 0, y = 0, armed = false;
    const near = (p) => Math.abs(p.clientX - x) + Math.abs(p.clientY - y) <= 10;
    if (window.PointerEvent) {
      el.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        x = e.clientX; y = e.clientY; armed = true;
      });
      el.addEventListener("pointerup", (e) => {
        if (armed && near(e)) fn(e);
        armed = false;
      });
      el.addEventListener("pointercancel", () => { armed = false; }); // a scroll took over
      return;
    }
    el.addEventListener("touchstart", (e) => {
      x = e.touches[0].clientX;
      y = e.touches[0].clientY;
    }, { passive: true });
    el.addEventListener("touchend", (e) => {
      if (!near(e.changedTouches[0])) return;
      e.preventDefault();
      fn(e);
    });
    el.addEventListener("mousedown", (e) => { e.preventDefault(); fn(e); });
  }

  let ctrlArmed = false;

  function sendRaw(d) {
    if (VIEW_ONLY || !current || !online()) return;
    ws.send(JSON.stringify({ op: "input", id: current, data: strToB64(d) }));
  }
  function sendData(d) {
    sendRaw(d);
    // Typing while scrolled up in history: snap back to the live prompt.
    if (term) term.scrollToBottom();
  }

  // Resize the PTY to this viewport (tmux-style "last client wins") so TUIs
  // reflow to phone width instead of wrapping 200-col desktop output.
  let resizeTimer;
  function sendResize() {
    if (VIEW_ONLY || !current || !online() || !term) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      ws.send(JSON.stringify({ op: "resize", id: current, cols: term.cols, rows: term.rows }));
    }, 250);
  }

  function refit() {
    if (!term || view !== "term") return;
    fit.fit();
    sendResize();
  }

  // iOS keyboard: it overlays the page without resizing the layout viewport,
  // hiding the key bar and the terminal's bottom. Sync the body height to the
  // visual viewport and pin the scroll so everything stays above the keyboard.
  // (Safari 12 has no visualViewport: see the else branch below.)
  let vvTimer;
  function syncViewport() {
    clearTimeout(vvTimer);
    vvTimer = setTimeout(() => {
      const vv = window.visualViewport;
      if (vv) {
        document.body.style.height = Math.round(vv.height) + "px";
        window.scrollTo(0, 0);
      }
      refit();
    }, 50);
  }
  if (window.visualViewport) {
    visualViewport.addEventListener("resize", syncViewport);
    visualViewport.addEventListener("scroll", syncViewport);
  } else {
    // See .novv in the CSS. iOS scrolls the page up while the keyboard is
    // open; put it back once the keyboard is gone.
    document.body.classList.add("novv");
    document.addEventListener("focusout", () => {
      setTimeout(() => {
        const a = document.activeElement;
        if (!a || !/^(INPUT|TEXTAREA)$/.test(a.tagName)) window.scrollTo(0, 0);
      }, 300);
    });
  }

  function initTerm() {
    term = new Terminal({
      fontSize: 13,
      fontFamily: 'ui-monospace, Menlo, monospace',
      scrollback: 3000,
      cursorBlink: true,
      // Agents mark links with OSC 8, so they can be tapped. xterm's default
      // opens the raw address, and "localhost" then means the phone.
      linkHandler: { activate: (e, uri) => showLink(uri) },
      theme: { background: "#0d1117", foreground: "#e6edf3", cursor: "#58a6ff" },
    });
    fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open($("term"));
    // GPU renderer — the DOM renderer chokes on full-screen TUI repaints
    // (every scroll step redraws the whole screen). Graceful fallback.
    try {
      const gl = new WebglAddon.WebglAddon();
      gl.onContextLoss(() => gl.dispose());
      term.loadAddon(gl);
    } catch { /* old WebView → DOM renderer */ }
    fit.fit();
    addEventListener("resize", refit);
    if (!VIEW_ONLY) {
      term.onData((d) => {
        // Sticky Ctrl from the key bar: next letter becomes a control char.
        if (ctrlArmed && d.length === 1) {
          const c = d.toLowerCase().charCodeAt(0);
          if (c >= 97 && c <= 122) d = String.fromCharCode(c - 96);
          setCtrl(false);
        }
        sendData(d);
      });
    }
    initTouchScroll();
  }

  function setCtrl(v) {
    ctrlArmed = v;
    $("ctrlKey").classList.toggle("armed", v);
  }

  // --- terminal interaction modes -----------------------------------------
  // mouseOn(): the app (Claude Code, tmux w/ mouse, herdr/bubbletea) captures
  // the mouse — forward touch gestures as SGR mouse reports.
  // altScreen(): full-screen TUI without its own scrollback.
  const mouseOn = () => {
    const mt = term.modes && term.modes.mouseTrackingMode;
    return mt && mt !== "none" && !VIEW_ONLY;
  };
  const altScreen = () => term.buffer.active.type === "alternate";
  function cellPos(x, y) {
    const el = $("term");
    return [
      Math.max(1, Math.min(term.cols, Math.ceil(x / (el.clientWidth / term.cols)))),
      Math.max(1, Math.min(term.rows, Math.ceil(y / (el.clientHeight / term.rows)))),
    ];
  }

  // Tap = mouse click (press + release) at the touched cell. This is how you
  // switch herdr/tmux tabs or pick list rows from the phone.
  function sendTap(x, y) {
    if (!mouseOn()) return;
    const [c, r] = cellPos(x, y);
    sendRaw(`\x1b[<0;${c};${r}M\x1b[<0;${c};${r}m`);
  }

  // Scroll the terminal by N lines.
  // - App captures the mouse (Claude Code, tmux w/ mouse, herdr): SGR wheel
  //   reports at the touch position, batched per animation frame into ONE
  //   message — one input read, one repaint (a flood of single reports is a
  //   redraw storm that garbles TUIs).
  // - Alt-screen without mouse (plain tmux, less): arrow keys — the alt
  //   buffer has no scrollback, scrollLines would be a no-op.
  // - Plain shells: local scrollback via scrollLines.
  let wheelAcc = 0, wheelPos = [1, 1], wheelRaf = 0;
  function flushWheel() {
    wheelRaf = 0;
    const n = Math.max(-4, Math.min(4, wheelAcc));
    wheelAcc = 0;
    if (!n) return;
    const btn = n > 0 ? 65 : 64; // 65 = wheel down, 64 = wheel up
    sendRaw(`\x1b[<${btn};${wheelPos[0]};${wheelPos[1]}M`.repeat(Math.abs(n)));
  }
  function scrollTerm(lines, x, y) {
    if (!lines) return;
    if (mouseOn()) {
      wheelPos = cellPos(x, y);
      wheelAcc += lines;
      if (!wheelRaf) wheelRaf = requestAnimationFrame(flushWheel);
    } else if (altScreen()) {
      if (VIEW_ONLY) return;
      const key = lines > 0 ? "\x1b[B" : "\x1b[A";
      sendRaw(key.repeat(Math.min(4, Math.abs(lines))));
    } else {
      term.scrollLines(lines);
    }
  }

  // Touch scrolling — xterm.js has no working touch scroll on iOS (touches
  // land on the screen layer, not the scrollable viewport). Translate drags
  // into scrollTerm, with a light momentum flick.
  function initTouchScroll() {
    const el = $("term");
    let lastY = null, lastT = 0, lastX = 0, acc = 0, velocity = 0, glide = 0;
    let startX = 0, startY = 0, startT = 0, moved = false;
    const cell = () => el.clientHeight / term.rows;
    const rel = (t) => {
      const r = el.getBoundingClientRect();
      return [t.clientX - r.left, t.clientY - r.top];
    };
    el.addEventListener("touchstart", (e) => {
      lastY = e.touches[0].clientY;
      lastX = e.touches[0].clientX;
      lastT = e.timeStamp;
      startX = lastX; startY = lastY; startT = e.timeStamp; moved = false;
      acc = 0; velocity = 0;
      cancelAnimationFrame(glide);
    }, { passive: true });
    el.addEventListener("touchmove", (e) => {
      if (lastY == null) return;
      e.preventDefault(); // stop page rubber-banding; taps still focus
      const t = e.touches[0];
      if (Math.abs(t.clientX - startX) + Math.abs(t.clientY - startY) > 10) moved = true;
      const dy = lastY - t.clientY;
      const dt = Math.max(1, e.timeStamp - lastT);
      velocity = dy / dt;
      lastY = t.clientY; lastX = t.clientX; lastT = e.timeStamp;
      acc += dy;
      const lines = Math.trunc(acc / cell());
      if (lines) {
        const [x, y] = rel(t);
        scrollTerm(lines, x, y);
        acc -= lines * cell();
      }
    }, { passive: false });
    el.addEventListener("touchend", (e) => {
      lastY = null;
      // Quick tap on a mouse-capturing TUI → forward as ONE click (switch
      // herdr/tmux tabs, pick list rows). preventDefault stops iOS from
      // synthesizing mousedown/mouseup afterwards — xterm would translate
      // those into a SECOND click report (tap → switch → switch back).
      if (!moved && e.timeStamp - startT < 350 && mouseOn()) {
        e.preventDefault();
        const r = el.getBoundingClientRect();
        sendTap(startX - r.left, startY - r.top);
        term.focus(); // preventDefault also suppressed the focus click
        velocity = 0;
        return;
      }
      // Momentum only for LOCAL scrollback — gliding into a TUI would spray
      // wheel/arrow input and garble it.
      if (mouseOn() || altScreen()) { velocity = 0; return; }
      let v = velocity * 16; // px per frame
      velocity = 0;
      const x = lastX - el.getBoundingClientRect().left;
      const step = () => {
        if (Math.abs(v) < 1) return;
        acc += v;
        const lines = Math.trunc(acc / cell());
        if (lines) { scrollTerm(lines, x, el.clientHeight / 2); acc -= lines * cell(); }
        v *= 0.92;
        glide = requestAnimationFrame(step);
      };
      glide = requestAnimationFrame(step);
    }, { passive: false });
  }

  function initKeybar() {
    for (const b of document.querySelectorAll(".keybar button[data-seq]")) {
      press(b, () => sendData(b.dataset.seq));
    }
    press($("ctrlKey"), () => setCtrl(!ctrlArmed));
    const setFont = (delta) => {
      term.options.fontSize = Math.max(8, Math.min(20, term.options.fontSize + delta));
      refit();
    };
    press($("fontMinus"), () => setFont(-1));
    press($("fontPlus"), () => setFont(1));
  }

  // --- quick actions -------------------------------------------------------
  // A floating button for one-handed use: templates, voice, keyboard, links.
  // Its settings live in this browser (localStorage), so each phone - and each
  // address it opened, LAN or Tailscale - keeps its own.
  const PREFS = "playdown-remote.quick";
  const SIZES = { s: 44, m: 54, l: 64 };
  const MAX_TEMPLATES = 4;
  const prefs = { pos: "br", size: "m", templates: [] };
  try { Object.assign(prefs, JSON.parse(localStorage.getItem(PREFS)) || {}); } catch (e) { /* private mode */ }
  if (!Array.isArray(prefs.templates)) prefs.templates = [];
  function savePrefs() {
    try { localStorage.setItem(PREFS, JSON.stringify(prefs)); } catch (e) { /* private mode */ }
  }

  function el(tag, props, kids) {
    const n = document.createElement(tag);
    if (props) Object.assign(n, props);
    for (const k of kids || []) n.appendChild(typeof k === "string" ? document.createTextNode(k) : k);
    return n;
  }
  const ICONS = {
    plus: '<path d="M12 5v14M5 12h14"/>',
    mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
    keys: '<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>',
    link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
    sliders: '<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  };
  const icon = (name) =>
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;

  // The menu fans out around the button: actions on an inner ring, templates
  // on an outer one, over the quarter (corner) or half (edge) of the circle
  // that faces the screen. Each arc runs [from, to] in degrees, 0 = right,
  // 90 = down.
  const ARCS = { br: [180, 270], bl: [0, -90], mr: [270, 90], ml: [-90, 90] };
  let radialOpen = false, ring = [], hover = -1, ringHint = "";

  function placeFab() {
    if (VIEW_ONLY) return; // no button: nothing to type
    const pos = ARCS[prefs.pos] ? prefs.pos : "br";
    const where = (pos[0] === "m" ? "at-m" : "at-b") + (pos[1] === "l" ? " at-l" : " at-r");
    $("viewTerm").style.setProperty("--fab", (SIZES[prefs.size] || SIZES.m) + "px");
    $("fab").className = where + (radialOpen ? " open" : "");
  }

  function openRadial() {
    radialOpen = true;
    placeFab();
    const box = $("radial");
    box.classList.remove("hide");
    for (const it of ring) box.removeChild(it.el);
    const area = box.getBoundingClientRect(), fab = $("fab").getBoundingClientRect();
    const cx = fab.left + fab.width / 2 - area.left, cy = fab.top + fab.height / 2 - area.top;
    const kbUp = document.activeElement === term.textarea;
    const acts = [
      { k: "voice", icon: "mic", label: "Voice input", run: openVoice },
      { k: "keyboard", icon: "keys", label: kbUp ? "Hide keyboard" : "Show keyboard", run: () => (kbUp ? term.blur() : term.focus()) },
      { k: "links", icon: "link", label: "Links", run: openLinks },
      { k: "settings", icon: "sliders", label: "Settings", run: openSettings },
    ];
    const tpls = prefs.templates.filter((t) => t && t.text).slice(0, MAX_TEMPLATES).map((t, i) => ({
      k: "t" + i, text: t.text, enter: t.run, label: t.text + (t.run ? "  ↵" : ""),
      run: () => typeText(t.text, t.run),
    }));
    const r1 = fab.width / 2 + 76;
    ring = fan(acts, r1, 48, cx, cy, area).concat(fan(tpls, r1 + 66, 56, cx, cy, area));
    ringHint = tpls.length ? "Tap, or hold and slide" : "Tap, or hold and slide. Templates: Settings";
    hover = -1;
    $("radialHint").textContent = ringHint;
    void box.offsetWidth; // commit the folded state so the fan-out animates
    for (const it of ring) { it.el.style.transform = ""; it.el.style.opacity = ""; }
  }
  // Lay items along the arc at radius r, kept inside the area.
  function fan(list, r, size, cx, cy, area) {
    const arc = ARCS[prefs.pos] || ARCS.br, pad = size / 2 + 6;
    return list.map((it, i) => {
      const a = (arc[0] + (arc[1] - arc[0]) * (list.length === 1 ? 0.5 : i / (list.length - 1))) * Math.PI / 180;
      it.x = Math.max(pad, Math.min(area.width - pad, cx + r * Math.cos(a)));
      it.y = Math.max(pad, Math.min(area.height - pad, cy + r * Math.sin(a)));
      it.reach = size / 2 + 10;
      const n = el("div", { className: it.icon ? "ri" : "ri tp" });
      n.setAttribute("data-k", it.k);
      if (it.icon) n.innerHTML = icon(it.icon);
      else {
        n.textContent = it.text.length <= 7 ? it.text : it.text.slice(0, 6) + "…";
        if (it.enter) n.appendChild(el("span", { className: "run", textContent: "↵" }));
      }
      n.style.left = it.x + "px";
      n.style.top = it.y + "px";
      // Start folded into the button.
      n.style.transform = `translate(${cx - it.x}px, ${cy - it.y}px) scale(.3)`;
      n.style.opacity = "0";
      $("radial").appendChild(n);
      it.el = n;
      return it;
    });
  }
  function closeRadial() {
    radialOpen = false;
    hover = -1;
    $("radial").classList.add("hide");
    placeFab();
  }
  // The ring item under a finger (client coordinates), or -1. Reach is a
  // little past each circle's edge, no further: a template may press Enter.
  function ringAt(p) {
    if (!p || !radialOpen) return -1;
    const area = $("radial").getBoundingClientRect();
    const x = p.clientX - area.left, y = p.clientY - area.top;
    let best = -1, bestD = Infinity;
    ring.forEach((it, i) => {
      const d = Math.sqrt((it.x - x) * (it.x - x) + (it.y - y) * (it.y - y));
      if (d < it.reach && d < bestD) { best = i; bestD = d; }
    });
    return best;
  }
  function setHover(i) {
    if (i === hover) return;
    hover = i;
    ring.forEach((it, k) => it.el.classList.toggle("on", k === i));
    $("radialHint").textContent = i >= 0 ? ring[i].label : ringHint;
  }
  function choose(i) {
    const it = ring[i];
    closeRadial();
    it.run();
  }

  // Press, slide and release on one element. Touch: the finger stays with the
  // element it started on, and iOS counts touchend as a user action, so Voice
  // and Keyboard may raise the keyboard from it. preventDefault keeps focus
  // (and the keyboard) on the terminal and stops the copied mouse events, so
  // the mouse listeners only hear a real mouse or pen.
  function drag(target, on) {
    const pt = (e) => (e.changedTouches ? e.changedTouches[0] : e);
    target.addEventListener("touchstart", (e) => { e.preventDefault(); on.down(pt(e)); }, { passive: false });
    target.addEventListener("touchmove", (e) => { e.preventDefault(); on.move(pt(e)); }, { passive: false });
    target.addEventListener("touchend", (e) => { e.preventDefault(); on.up(pt(e)); });
    target.addEventListener("touchcancel", () => on.up(null));
    let active = false;
    target.addEventListener("mousedown", (e) => { e.preventDefault(); active = true; on.down(e); });
    addEventListener("mousemove", (e) => { if (active) on.move(e); });
    addEventListener("mouseup", (e) => { if (active) { active = false; on.up(e); } });
  }

  // Type into the session as if keyed in. Enter follows a beat later as its
  // own keypress, so the app has taken the text before the submit.
  function typeText(text, enter) {
    if (/[\r\n]/.test(text)) term.paste(text); // honours bracketed paste
    else sendData(text);
    if (enter) setTimeout(() => sendData("\r"), 120);
  }

  function openSheet(title, kids) {
    closeRadial();
    $("sheetTitle").textContent = title;
    const body = $("sheetBody");
    body.innerHTML = "";
    for (const k of kids) body.appendChild(k);
    $("sheet").classList.remove("hide");
    $("sheetShade").classList.remove("hide");
    $("sheet").scrollTop = 0;
  }
  function closeSheet() {
    $("sheet").classList.add("hide");
    $("sheetShade").classList.add("hide");
    if (rec) { try { rec.abort(); } catch (e) { /* already stopped */ } rec = null; }
  }

  // Voice: browsers allow their speech API on https only, and this page is
  // plain http on the LAN/tailnet. So the dependable path is the mic key on
  // the phone keyboard, into a text box; the speech API is a bonus where allowed.
  let rec = null;
  function openVoice() {
    const ta = el("textarea", { className: "field", rows: 3, placeholder: "Speak or type, then Send" });
    const note = el("div", { className: "note", textContent: "Tap the mic on your keyboard to dictate." });
    const done = (enter) => () => {
      const text = ta.value.trim();
      closeSheet();
      if (text) typeText(text, enter);
      if (!enter) term.focus(); // keep typing after the inserted text
    };
    const btns = el("div", { className: "btns" });
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR && window.isSecureContext) {
      const mic = el("button", { textContent: "Listen" });
      mic.onclick = () => listen(SR, ta, note, mic);
      btns.appendChild(mic);
    }
    btns.appendChild(el("button", { textContent: "Insert", onclick: done(false) }));
    btns.appendChild(el("button", { className: "primary", textContent: "Send", onclick: done(true) }));
    openSheet("Voice input", [ta, note, btns]);
    ta.focus();
  }
  function listen(SR, ta, note, mic) {
    if (rec) { rec.stop(); return; }
    const before = ta.value ? ta.value.replace(/\s*$/, " ") : "";
    const r = (rec = new SR());
    r.lang = navigator.language || "en-US";
    r.interimResults = true;
    r.onresult = (e) => {
      let said = "";
      for (let i = 0; i < e.results.length; i++) said += e.results[i][0].transcript;
      ta.value = before + said;
    };
    r.onerror = (e) => { note.textContent = `Voice stopped (${e.error}). Use the mic on your keyboard instead.`; };
    // Ends arrive late: an aborted run must not clear a newer one.
    r.onend = () => { if (rec === r) rec = null; mic.textContent = "Listen"; };
    r.start();
    mic.textContent = "Stop";
  }

  // Links: the terminal is drawn on a canvas, so nothing in it can be tapped
  // or selected. List the URLs in recent output as real links instead.
  function bufferLines(n) {
    const buf = term.buffer.active, out = [];
    for (let i = Math.max(0, buf.length - n); i < buf.length; i++) {
      const row = buf.getLine(i);
      if (!row) continue;
      const s = row.translateToString(true);
      // Rows the terminal soft-wrapped make one line.
      if (row.isWrapped && out.length) out[out.length - 1] += s;
      else out.push(s);
    }
    return out;
  }
  const URL_RE = /https?:\/\/[^\s"'<>`─-╿]+/g;
  const WORD_RE = /^\s*([^\s"'<>`─-╿]+)(.*)$/;
  function findLinks() {
    const lines = bufferLines(1500), found = [];
    // A line is "full" when it reaches the right edge of the text around it
    // (borders and rules aside) - the only place a TUI breaks a long word -
    // and that edge is near the terminal's width, not a column of short lines.
    const BOX = /[─-╿]/;
    const full = (i) => {
      if (lines[i].length < term.cols - 10) return false;
      let max = 0;
      for (let k = Math.max(0, i - 6); k <= Math.min(lines.length - 1, i + 6); k++) {
        if (!BOX.test(lines[k])) max = Math.max(max, lines[k].length);
      }
      return lines[i].length >= max - 1;
    };
    lines.forEach((line, i) => {
      URL_RE.lastIndex = 0;
      let m;
      while ((m = URL_RE.exec(line))) {
        let url = m[0], j = i, atEdge = m.index + url.length === line.length;
        // TUIs such as Claude Code break a long URL onto the next row
        // themselves: when it runs to the edge of a full line, the next
        // line's first word is the rest of it.
        while (atEdge && j + 1 < lines.length && full(j)) {
          const w = WORD_RE.exec(lines[j + 1]);
          if (!w) break;
          url += w[1];
          atEdge = !w[2];
          j++;
        }
        url = url.replace(/[.,;:!?*_'"]+$/, "");
        // Drop a closing bracket the URL didn't open: "(see https://x.io)".
        const opens = (url.match(/[([]/g) || []).length;
        if (/[)\]]$/.test(url) && (url.match(/[)\]]/g) || []).length > opens) url = url.slice(0, -1);
        found.push(url);
      }
    });
    const seen = {};
    return found.reverse().filter((u) => !seen[u] && (seen[u] = true)).slice(0, 12);
  }
  // "localhost" in a link means the computer, not this phone: point it at the
  // address this page came from. A phone that came in over the LAN also gets
  // the Tailscale address, where servers bound to localhost + Tailscale only
  // (like lavish) answer.
  const LOOPBACK = /^(https?:\/\/)(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])(?=[:/?#]|$)/i;
  function linkRows(url) {
    const rows = [];
    const add = (href, note) => {
      const a = el("a", { className: "lk", href, target: "_blank", rel: "noopener noreferrer", textContent: href });
      if (note) a.appendChild(el("small", { textContent: note }));
      rows.push(a);
    };
    if (!LOOPBACK.test(url)) {
      add(url);
      return rows;
    }
    const at = (h) => url.replace(LOOPBACK, "$1" + (h.indexOf(":") >= 0 ? `[${h}]` : h));
    const was = url.replace(/^https?:\/\//, "").split("/")[0];
    const here = location.hostname;
    add(at(here), `Was ${was} on the computer. Opens only if that server accepts outside connections.`);
    if (tsHost && tsHost !== here && !/\.ts\.net$/i.test(here)) {
      add(at(tsHost), "Same link over Tailscale, if the one above doesn't load. Needs Tailscale on this phone.");
    }
    return rows;
  }
  // A link tapped in the terminal.
  function showLink(url) {
    if (term) term.blur();
    openSheet("Open link", linkRows(url));
  }
  function openLinks() {
    term.blur();
    const kids = [];
    for (const url of findLinks()) kids.push.apply(kids, linkRows(url));
    if (!kids.length) kids.push(el("div", { className: "note", textContent: "No links in the recent output." }));
    kids.push(el("button", { className: "wide", textContent: "Show output as text", onclick: openText }));
    openSheet("Links", kids);
  }
  // Fallback for anything the link finder misses: plain, selectable text.
  function openText() {
    const text = bufferLines(400).join("\n").replace(/\s+$/, "");
    openSheet("Output as text", [
      el("div", { className: "note", textContent: "Press and hold to select and copy." }),
      el("pre", { className: "plain", textContent: text }),
    ]);
    $("sheet").scrollTop = $("sheet").scrollHeight;
  }

  function openSettings() {
    term.blur();
    const seg = (key, opts, cls) => {
      const box = el("div", { className: "seg" + (cls ? " " + cls : "") });
      for (const [val, label] of opts) {
        const b = el("button", { className: prefs[key] === val ? "on" : "", textContent: label });
        b.onclick = () => {
          prefs[key] = val;
          savePrefs();
          placeFab();
          for (const x of box.children) x.className = x === b ? "on" : "";
        };
        box.appendChild(b);
      }
      return box;
    };
    const rows = [];
    const examples = ["/lavish", "/mr-feedback-review", "", ""];
    for (let i = 0; i < MAX_TEMPLATES; i++) {
      const t = prefs.templates[i] || { text: "", run: true };
      const inp = el("input", { className: "field", type: "text", value: t.text, placeholder: examples[i] });
      inp.setAttribute("autocapitalize", "off");
      inp.setAttribute("autocorrect", "off");
      inp.spellcheck = false;
      const chk = el("input", { type: "checkbox", checked: t.run !== false });
      const sync = () => {
        prefs.templates[i] = { text: inp.value.trim(), run: chk.checked };
        savePrefs();
      };
      inp.oninput = sync;
      chk.onchange = sync;
      rows.push(el("div", { className: "trow" }, [inp, el("label", {}, [chk, "Enter"])]));
    }
    openSheet("Quick actions", [
      el("div", { className: "h", textContent: "BUTTON POSITION" }),
      seg("pos", [["br", "Bottom right"], ["bl", "Bottom left"], ["mr", "Middle right"], ["ml", "Middle left"]], "two"),
      el("div", { className: "h", textContent: "BUTTON SIZE" }),
      seg("size", [["s", "Small"], ["m", "Medium"], ["l", "Large"]]),
      el("div", { className: "h", textContent: "TEMPLATES (UP TO 4)" }),
    ].concat(rows, [
      el("div", {
        className: "note",
        textContent: "Enter on: the command runs right away. Off: it is typed so you can add to it. Saved in this browser, for this address.",
      }),
    ]));
  }

  function initQuick() {
    if (VIEW_ONLY) return;
    $("fab").innerHTML = icon("plus");
    // Tap: open (and tap a choice), tap again to close. Hold: slide to a
    // choice and let go; let go anywhere else to close.
    let gesture = null;
    drag($("fab"), {
      down(p) {
        gesture = { x: p.clientX, y: p.clientY, wasOpen: radialOpen, moved: false };
        if (!radialOpen) openRadial();
      },
      move(p) {
        if (!gesture) return;
        // Slack for a tap that drifts; reaching any choice is a longer slide.
        if (Math.abs(p.clientX - gesture.x) + Math.abs(p.clientY - gesture.y) > 24) gesture.moved = true;
        setHover(ringAt(p));
      },
      up(p) {
        const g = gesture;
        gesture = null;
        if (!g) return;
        const i = ringAt(p);
        if (i >= 0) choose(i);
        else if (g.wasOpen || g.moved) closeRadial();
        else setHover(-1);
      },
    });
    // Open menu: a tap on a choice picks it; a tap anywhere else closes.
    let startedOn = -1;
    drag($("radial"), {
      down(p) { startedOn = ringAt(p); setHover(startedOn); },
      move(p) { setHover(ringAt(p)); },
      up(p) {
        const i = ringAt(p);
        if (i >= 0 && i === startedOn) choose(i);
        else closeRadial();
      },
    });
    // The ring is laid out for the screen it opened on.
    const fold = () => { if (radialOpen) closeRadial(); };
    addEventListener("resize", fold);
    if (window.visualViewport) visualViewport.addEventListener("resize", fold);
    $("sheetShade").addEventListener("click", closeSheet);
    $("sheetClose").addEventListener("click", closeSheet);
    placeFab();
  }

  function name(s) { return s.custom || s.title || s.label; }

  const STATUS_SECTIONS = [
    { key: "blocked", label: "NEEDS YOU" },
    { key: "working", label: "WORKING" },
    { key: "done", label: "DONE" },
    { key: "idle", label: "IDLE" },
  ];

  function indicator(status) {
    const el = document.createElement("span");
    el.className = status === "working" ? "spin" : "dot " + status;
    return el;
  }

  function sendOp(obj) {
    if (VIEW_ONLY || !online()) return;
    ws.send(JSON.stringify(obj));
  }

  function renderList() {
    const root = $("viewList");
    root.innerHTML = "";
    if (!VIEW_ONLY && online()) {
      const acts = document.createElement("div");
      acts.className = "actions";
      const mk = (label, agent) => {
        const b = document.createElement("button");
        b.textContent = label;
        b.onclick = () => sendOp({ op: "open", agent });
        acts.appendChild(b);
      };
      mk("+ agent", true);
      mk("+ terminal", false);
      root.appendChild(acts);
    }
    if (!sessions.length) {
      const d = document.createElement("div");
      d.className = "empty";
      d.textContent = expired
        ? "This link has expired - Playdown starts a new one each run. Scan the QR again in Playdown → Settings → Remote."
        : online() ? "No terminal sessions in Playdown." : "Connecting…";
      root.appendChild(d);
      return;
    }
    for (const sect of STATUS_SECTIONS) {
      const items = sessions.filter((s) => s.status === sect.key);
      if (!items.length) continue;
      const box = document.createElement("div");
      box.className = "sect";
      const h = document.createElement("h2");
      h.appendChild(indicator(sect.key));
      h.appendChild(document.createTextNode(sect.label));
      box.appendChild(h);
      for (const s of items) {
        // div, not button — it holds a nested close button.
        const b = document.createElement("div");
        b.className = "row" + (s.status === "blocked" ? " blocked" : "");
        b.appendChild(indicator(s.status));
        const meta = document.createElement("div");
        meta.className = "meta";
        const nm = document.createElement("div");
        nm.className = "nm";
        nm.textContent = name(s);
        meta.appendChild(nm);
        if (s.label && s.label !== name(s)) {
          const sub = document.createElement("div");
          sub.className = "sub";
          sub.textContent = s.label;
          meta.appendChild(sub);
        }
        b.appendChild(meta);
        if (!VIEW_ONLY) {
          const x = document.createElement("button");
          x.className = "x";
          x.textContent = "✕";
          x.onclick = (e) => {
            e.stopPropagation();
            if (confirm(`Close "${name(s)}"? The process will be killed.`)) {
              sendOp({ op: "close", id: s.id });
            }
          };
          b.appendChild(x);
        }
        b.onclick = () => openSession(s.id);
        box.appendChild(b);
      }
      root.appendChild(box);
    }
    const ver = document.createElement("div");
    ver.className = "ver";
    ver.textContent = `playdown-remote v${VERSION}`;
    root.appendChild(ver);
  }

  function renderHeader() {
    const inTerm = view === "term";
    $("back").style.display = inTerm ? "block" : "none";
    $("brand").style.display = inTerm ? "none" : "inline";
    $("hdrSession").style.display = inTerm ? "inline-flex" : "none";
    $("count").textContent = inTerm ? "" : (sessions.length || "");
    if (inTerm) {
      const s = sessions.find((x) => x.id === current);
      $("hdrName").textContent = s ? name(s) : "";
      $("hdrDot").className = s && s.status === "working" ? "spin" : "dot " + (s ? s.status : "");
    }
  }

  function openSession(id) {
    view = "term";
    $("viewList").style.display = "none";
    $("viewTerm").style.display = "flex";
    const fresh = id !== current;
    current = id;
    renderHeader(); // before the terminal, so Back works even if it fails
    try {
      if (!term) initTerm();
      if (fresh) {
        term.reset();
        if (online()) ws.send(JSON.stringify({ op: "attach", id }));
        // After the scrollback replay lands, the resize's SIGWINCH makes the
        // TUI redraw itself at phone width.
        sendResize();
      }
      requestAnimationFrame(() => { refit(); term.focus(); });
    } catch (e) {
      $("err").textContent = `The terminal could not start in this browser: ${e.message} (tap to hide)`;
      $("err").className = "";
      // Don't keep a half-built terminal: the next open starts over.
      try { term.dispose(); } catch (x) { /* it never finished */ }
      term = null;
      $("term").innerHTML = "";
    }
  }

  function goBack() {
    view = "list";
    $("viewTerm").style.display = "none";
    $("viewList").style.display = "block";
    renderList();
    renderHeader();
    closeRadial();
    closeSheet();
    if (term) term.blur(); // let the iOS keyboard close
  }

  function connect() {
    let opened = false;
    ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws?token=${token}`);
    ws.onopen = () => { opened = true; $("conn").classList.add("up"); ws.send(JSON.stringify({ op: "sessions" })); };
    ws.onclose = async () => {
      $("conn").classList.remove("up");
      // Refused before it ever opened: either the server is down (keep
      // retrying) or this link is from an earlier run - the token changes on
      // every start, so retrying would spin on "Connecting…" forever.
      if (!opened) {
        const r = await fetch(`/auth?token=${token}`, { cache: "no-store" }).catch(() => null);
        if (r && r.status === 401) return showExpired();
      }
      setTimeout(connect, 2000);
    };
    ws.onmessage = (m) => {
      let ev;
      try { ev = JSON.parse(m.data); } catch { return; }
      if (ev.ev === "hello") {
        tsHost = ev.tailscale || "";
      } else if (ev.ev === "sessions") {
        sessions = ev.sessions || [];
        if (current && !sessions.some((s) => s.id === current)) {
          current = null;
          if (term) term.reset();
          if (view === "term") goBack();
        }
        if (view === "list") renderList();
        renderHeader();
      } else if ((ev.ev === "scrollback" || ev.ev === "output") && ev.id === current && term) {
        term.write(b64ToBytes(ev.data));
      }
    };
  }

  function showExpired() {
    expired = true;
    sessions = [];
    current = null;
    if (view === "term") goBack();
    else renderList();
    renderHeader();
  }

  // Scanning a new QR into a tab that already shows this page only changes
  // the #fragment, which doesn't reload - pick up the new token.
  addEventListener("hashchange", () => location.reload());

  $("back").addEventListener("click", goBack);
  $("err").addEventListener("click", () => $("err").classList.add("hide"));
  initKeybar();
  initQuick();
  renderList();
  renderHeader();
  connect();
</script>
</body>
</html>
